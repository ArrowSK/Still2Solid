name: Fix storage patch runner

on:
  push:
    branches:
      - patch/storage-uninstall-0.8.1

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[runner-fix]') && !contains(github.event.head_commit.message, '[storage-patch]') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Add Tauri Linux prerequisites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-storage-uninstall-patch.yml')
          text = path.read_text()
          anchor = "      - name: Refresh lockfiles\n"
          block = "      - name: Install Tauri Linux prerequisites\n        run: |\n          sudo apt-get update\n          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf\n\n"
          if block not in text:
              if anchor not in text:
                  raise SystemExit('refresh lockfiles anchor missing')
              path.write_text(text.replace(anchor, block + anchor, 1))
          PY
      - name: Commit runner fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-storage-uninstall-patch.yml
          if git diff --cached --quiet; then
            echo "Runner already fixed"
          else
            git commit -m "chore: install Tauri Linux prerequisites [runner-fix]"
            git push origin HEAD
          fi
