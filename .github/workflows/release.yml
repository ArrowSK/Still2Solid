name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
            label: macOS Apple Silicon
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows x64
    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux bundle prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Prepare checksum-verified bundled Python
        run: python scripts/prepare_python_runtime.py --target ${{ matrix.target }}

      - name: Validate bundled interpreter
        shell: bash
        if: matrix.platform != 'windows-latest'
        run: src-tauri/resources/python/bin/python3 -c "import sys; assert sys.version_info[:2] == (3, 12); print(sys.version)"

      - name: Validate bundled interpreter (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: '& src-tauri/resources/python/python.exe -c "import sys; assert sys.version_info[:2] == (3, 12); print(sys.version)"'

      - name: Configure macOS signing identity
        if: matrix.platform == 'macos-14'
        shell: bash
        env:
          SIGNING_IDENTITY_VALUE: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ -n "$SIGNING_IDENTITY_VALUE" ]]; then
            echo "::add-mask::$SIGNING_IDENTITY_VALUE"
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY_VALUE" >> "$GITHUB_ENV"
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      - name: Build and publish release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: Still2Solid v__VERSION__
          releaseBody: |
            Still2Solid desktop release. Model weights are installed separately in-app and are not embedded in the application package.

            First start includes a hardware-aware model selection wizard. TripoSR installation retries transient downloads, uses a verified GitHub blob fallback for pinned source files, and only reveals an alternate checkpoint-link recovery option after an automatic installation failure. Recovery checkpoints must still match the pinned SHA-256.

            Settings includes a manual in-app updater that checks GitHub Releases on demand, verifies the downloaded macOS DMG, and opens the normal replacement installer. Settings → Storage provides model removal, cache cleanup and complete-uninstall preparation while normal upgrades keep downloaded models.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Verify macOS app signature
        if: matrix.platform == 'macos-14'
        shell: bash
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Still2Solid.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1
