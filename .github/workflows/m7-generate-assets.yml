name: M7 generate release assets

on:
  push:
    branches: [branding/app-logo]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branding/app-logo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Generate Cargo lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Generate native icon set from canonical vector
        run: |
          npm install --ignore-scripts
          npx tauri icon assets/branding/still2solid-icon.svg --output src-tauri/icons
      - name: Commit generated release assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock src-tauri/icons
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "M7: generate lockfiles and native icon set"
          git push origin HEAD:branding/app-logo
