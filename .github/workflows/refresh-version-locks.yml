name: Refresh version lockfiles

on:
  push:
    branches:
      - 'patch/self-cleaning-0.8.2'
    paths:
      - '.github/workflows/refresh-version-locks.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch/self-cleaning-0.8.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh npm lock metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Refresh Cargo lock metadata
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Commit refreshed locks
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Lockfiles already current"
          else
            git commit -m "chore: refresh 0.8.2 lockfiles"
            git push origin HEAD:patch/self-cleaning-0.8.2
          fi
