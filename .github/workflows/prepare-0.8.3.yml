name: Prepare 0.8.3 metadata

on:
  push:
    branches:
      - 'fix/triposr-updater-0.8.3'
    paths:
      - '.github/workflows/prepare-0.8.3.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/triposr-updater-0.8.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply release metadata and UI version wiring
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:80]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('package.json', '"version": "0.8.2"', '"version": "0.8.3"')
          replace_once('src-tauri/Cargo.toml', 'version = "0.8.2"', 'version = "0.8.3"')
          replace_once('src-tauri/tauri.conf.json', '"version": "0.8.2"', '"version": "0.8.3"')

          app = Path('apps/desktop/ui/src/App.svelte')
          text = app.read_text(encoding='utf-8')
          text = text.replace(
              "import { onDestroy, onMount } from 'svelte';",
              "import { onDestroy, onMount } from 'svelte';\n  import { getVersion } from '@tauri-apps/api/app';",
              1,
          )
          text = text.replace(
              "  let settingsOpen = false;",
              "  let settingsOpen = false;\n  let appVersion = 'development';",
              1,
          )
          old_mount = """    const [detectedHardware, detectedRuntimes] = await Promise.all([\n      getHardwareProfile(),\n      getModelRuntimeStates(),\n    ]);\n    hardware = detectedHardware;\n    runtimeStates = detectedRuntimes;"""
          new_mount = """    const [detectedHardware, detectedRuntimes, detectedVersion] = await Promise.all([\n      getHardwareProfile(),\n      getModelRuntimeStates(),\n      getVersion().catch(() => 'development'),\n    ]);\n    hardware = detectedHardware;\n    runtimeStates = detectedRuntimes;\n    appVersion = detectedVersion;"""
          if old_mount not in text:
              raise SystemExit('App onMount version block was not found')
          text = text.replace(old_mount, new_mount, 1)
          text = text.replace('<div class="milestone">v0.8.1</div>', '<div class="milestone">v{appVersion}</div>', 1)
          text = text.replace('<span>Still2Solid v0.8.1</span>', '<span>Still2Solid v{appVersion}</span>', 1)
          settings_block = """  platform={hardware.platform}\n  disabled={generating}\n/>"""
          if settings_block not in text:
              raise SystemExit('SettingsPanel appVersion insertion point was not found')
          text = text.replace(settings_block, """  platform={hardware.platform}\n  {appVersion}\n  disabled={generating}\n/>""", 1)
          app.write_text(text, encoding='utf-8')

          security = Path('docs/SECURITY_PRIVACY.md')
          text = security.read_text(encoding='utf-8')
          text = text.replace(
              'Network access is used when preparing release/runtime dependencies and when the user installs a production model. Production inference itself is designed to work from local installed assets.',
              'Network access is used when preparing release/runtime dependencies, when the user installs a production model, and when the user explicitly checks for or downloads an application update. Production inference itself is designed to work from local installed assets.',
              1,
          )
          marker = 'Downloads are constrained by the adapter/release code:\n'
          addition = """\nApplication update checks are manual. The updater talks only to the public `ArrowSK/Still2Solid` GitHub Releases endpoint after the user presses **Check for updates**. A downloaded Apple Silicon DMG is kept in Still2Solid's cache, verified against the SHA-256 digest/checksum published with the release, and only then opened through the normal macOS installer route. The updater does not disable or bypass Gatekeeper.\n"""
          if marker not in text:
              raise SystemExit('Security updater insertion point was not found')
          text = text.replace(marker, marker + addition, 1)
          security.write_text(text, encoding='utf-8')
      - name: Refresh npm lock metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Refresh Cargo lock metadata
        run: cargo update --manifest-path src-tauri/Cargo.toml --workspace
      - name: Commit prepared metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json apps/desktop/ui/src/App.svelte docs/SECURITY_PRIVACY.md
          git commit -m "chore: prepare Still2Solid 0.8.3 release metadata"
          git push origin HEAD:fix/triposr-updater-0.8.3
