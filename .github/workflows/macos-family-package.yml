name: macOS Family Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/macos-family-package.yml'
  push:
    branches:
      - 'release/**'

permissions:
  contents: write

jobs:
  build-macos-apple-silicon:
    name: Build macOS Apple Silicon DMG
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Prepare checksum-verified bundled Python
        run: python scripts/prepare_python_runtime.py --target aarch64-apple-darwin

      - name: Validate bundled Python
        run: src-tauri/resources/python/bin/python3 -c "import sys; assert sys.version_info[:2] == (3, 12); print(sys.version)"

      - name: Detect Apple signing configuration
        id: apple-signing
        shell: bash
        env:
          CERTIFICATE_VALUE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD_VALUE: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY_VALUE: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ -n "$CERTIFICATE_VALUE" && -n "$CERTIFICATE_PASSWORD_VALUE" && -n "$SIGNING_IDENTITY_VALUE" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed Still2Solid DMG
        if: steps.apple-signing.outputs.available == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri:build -- --target aarch64-apple-darwin --bundles dmg

      - name: Build unsigned Still2Solid DMG
        if: steps.apple-signing.outputs.available != 'true'
        run: npm run tauri:build -- --target aarch64-apple-darwin --bundles dmg

      - name: Create checksum
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
          shasum -a 256 *.dmg > Still2Solid-macOS-Apple-Silicon.sha256.txt

      - name: Upload family install package
        uses: actions/upload-artifact@v4
        with:
          name: Still2Solid-macOS-Apple-Silicon
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_BUILD: ${{ steps.apple-signing.outputs.available }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-family-preview"
          TITLE="Still2Solid v${VERSION} Family Preview"
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          CHECKSUM="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Still2Solid-macOS-Apple-Silicon.sha256.txt"

          if [[ "$SIGNED_BUILD" == 'true' ]]; then
            SECURITY_NOTE="This macOS build was produced with the configured Apple Developer signing identity."
          else
            SECURITY_NOTE="This family-preview macOS build is currently unsigned. macOS may require Open Anyway on first launch."
          fi

          cat > /tmp/release-notes.md <<EOF
          Still2Solid is a local-first desktop app that turns a single image into a textured 3D asset.

          This preview contains the user-friendly macOS Apple Silicon package for M1/M2/M3/M4 Macs. Install it normally by opening the DMG and dragging Still2Solid to Applications. Python is bundled; model weights are installed from inside the app.

          ${SECURITY_NOTE}

          Current validation status: application CI and packaging CI are green. The physical M1 8 GB performance benchmark is still a real-device validation step, so this build is published as a prerelease rather than a stable release.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" "$CHECKSUM" --clobber
          else
            gh release create "$TAG" "$DMG" "$CHECKSUM" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file /tmp/release-notes.md \
              --prerelease
          fi
