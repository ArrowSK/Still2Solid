name: CI

on:
  push:
    branches: [main, 'milestone/**']
  pull_request:

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run build
      - name: Validate local worker and installer syntax
        run: |
          python3 -m py_compile \
            workers/triposr/worker.py \
            workers/sf3d/install.py \
            workers/sf3d/worker.py \
            scripts/prepare_python_runtime.py \
            scripts/validate_triposr_sources.py
      - name: Verify pinned TripoSR source URLs and hashes
        run: python3 scripts/validate_triposr_sources.py

  rust-core:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  bundled-runtime:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify pinned Python runtime
        run: python3 scripts/prepare_python_runtime.py --target x86_64-unknown-linux-gnu
      - name: Validate bundled interpreter
        run: src-tauri/resources/python/bin/python3 -c "import sys; assert sys.version_info[:2] == (3, 12); print(sys.version)"
