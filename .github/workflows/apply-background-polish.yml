name: Apply background guidance integration

on:
  push:
    branches:
      - branding/app-logo

permissions:
  contents: write

jobs:
  patch-app:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branding/app-logo
          fetch-depth: 0

      - name: Apply exact App.svelte integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/desktop/ui/src/App.svelte')
          text = path.read_text()

          old_import = "  import { onDestroy, onMount } from 'svelte';\n  import ModelManager from './lib/ModelManager.svelte';"
          new_import = "  import { onDestroy, onMount } from 'svelte';\n  import BackgroundAdvisor from './lib/BackgroundAdvisor.svelte';\n  import ModelManager from './lib/ModelManager.svelte';"

          old_anchor = """        </button>\n\n        <fieldset>\n          <legend>Quality</legend>"""
          new_anchor = """        </button>\n\n        <BackgroundAdvisor imageUrl={sourceUrl} bind:enabled={backgroundRemoval} disabled={generating} />\n\n        <fieldset>\n          <legend>Quality</legend>"""

          old_advanced = "<label class=\"check\"><input type=\"checkbox\" bind:checked={backgroundRemoval} disabled={generating} /> Isolate foreground object</label>"
          new_advanced = "<label class=\"check\"><input type=\"checkbox\" bind:checked={backgroundRemoval} disabled={generating} /> Foreground isolation (same setting as Background check)</label>"

          if "import BackgroundAdvisor from './lib/BackgroundAdvisor.svelte';" not in text:
              if old_import not in text:
                  raise SystemExit('Expected import anchor not found; refusing broad rewrite.')
              text = text.replace(old_import, new_import, 1)

          if '<BackgroundAdvisor imageUrl={sourceUrl}' not in text:
              if old_anchor not in text:
                  raise SystemExit('Expected recommendation/quality anchor not found; refusing broad rewrite.')
              text = text.replace(old_anchor, new_anchor, 1)

          if old_advanced in text:
              text = text.replace(old_advanced, new_advanced, 1)

          required = [
              "import BackgroundAdvisor from './lib/BackgroundAdvisor.svelte';",
              '<BackgroundAdvisor imageUrl={sourceUrl} bind:enabled={backgroundRemoval} disabled={generating} />',
              'Foreground isolation (same setting as Background check)',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Integration validation failed: {missing}')

          path.write_text(text)
          PY

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet -- apps/desktop/ui/src/App.svelte; then
            echo "App.svelte is already integrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/ui/src/App.svelte
          git commit -m "feat: integrate background guidance into generation flow"
          git push origin HEAD:branding/app-logo
