name: M7 finalize bundled runtime

on:
  push:
    branches: [branding/app-logo]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branding/app-logo
          fetch-depth: 0
      - name: Prefer verified bundled Python
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/runtime.rs')
          text = path.read_text()

          anchor = '''fn find_python() -> Result<(String, String), String> {\n    let mut candidates = Vec::<String>::new();'''
          replacement = '''fn find_python(app: &AppHandle) -> Result<(String, String), String> {\n    let mut candidates = Vec::<String>::new();\n\n    // Packaged M7 builds carry a checksum-verified Python 3.12 runtime as a\n    // Tauri resource. Prefer it before developer/system interpreters.\n    if let Ok(resources) = app.path().resource_dir() {\n        #[cfg(target_os = "windows")]\n        let relative = PathBuf::from("python.exe");\n        #[cfg(not(target_os = "windows"))]\n        let relative = PathBuf::from("bin").join("python3");\n\n        for base in [resources.join("python"), resources.join("resources").join("python")] {\n            let candidate = base.join(&relative);\n            if candidate.exists() {\n                candidates.push(candidate.to_string_lossy().into_owned());\n            }\n        }\n    }'''

          if 'fn find_python(app: &AppHandle)' not in text:
              if anchor not in text:
                  raise SystemExit('find_python anchor changed; refusing unsafe rewrite')
              text = text.replace(anchor, replacement, 1)

          text = text.replace(
              'let (system_python, python_version) = find_python()?;',
              'let (system_python, python_version) = find_python(&app)?;',
              1,
          )
          text = text.replace(
              'M3 currently requires a local Python 3.11 or 3.12 interpreter to create the isolated TripoSR runtime. A bundled end-user Python runtime is a later packaging milestone.',
              'Still2Solid could not find its bundled Python 3.12 runtime. Development builds may provide Python 3.11/3.12 with STILL2SOLID_PYTHON; packaged builds should be repaired or reinstalled instead of asking the user to configure Python manually.',
              1,
          )
          path.write_text(text)
          PY
      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/runtime.rs
          git rm .github/workflows/m7-patch-runtime.yml
          git commit -m "M7: prefer bundled pinned Python runtime"
          git push origin HEAD:branding/app-logo
